name: Static Code Review

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_mysql
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer dependencies
        run: composer install

      - name: Set up the database
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --env=testing

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      # ---------- Check errors on composer file ----------
      - name: Validate Composer
        run: composer validate --strict
      # ---------- Check vulnerabilities on project dependencies ----------
      - name: Audit dependencies
        run: composer audit --locked
      # ---------- Run Tests ----------
      - name: Run tests
        run: php artisan test
      # ---------- Laravel Pint (code style) ----------
      - name: Run Laravel Pint
        run: |
          vendor/bin/pint --test
      # ---------- PHPStan / Larastan ----------
      - name: Run PHPStan (Larastan)
        run: |
          vendor/bin/phpstan analyse --configuration=phpstan.neon
      # ---------- Semgrep SAST ----------
      - name: Set up Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        if: always()
        run: |
          python -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install semgrep

      - name: Run Semgrep SAST
        if: always()
        run: |
          /tmp/semgrep-venv/bin/semgrep scan \
            --config p/php \
            --config p/security-audit \
            --error \
            --json \
            --output semgrep-report.json \
            .

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: semgrep-report.json
          if-no-files-found: ignore
